      <stop offset="35%" stop-color="#d8f3ff"/>
      <stop offset="70%" stop-color="#7fd0ff"/>
      <stop offset="100%" stop-color="#2e7bff"/>
    </radialGradient>
    <linearGradient id="wandWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e1d10"/>
      <stop offset="40%" stop-color="#5a3a20"/>
      <stop offset="60%" stop-color="#6b4326"/>
      <stop offset="100%" stop-color="#241505"/>
    </linearGradient>
    <path id="spark" d="M0,-11 L2.3,-2.3 L11,0 L2.3,2.3 L0,11 L-2.3,2.3 L-11,0 L-2.3,-2.3 Z"/>
    <linearGradient id="groundGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8a3c" stop-opacity="0"/>
      <stop offset="70%" stop-color="#ff8a3c" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#2a1608" stop-opacity="0.28"/>
    </linearGradient>
