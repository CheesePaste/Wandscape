  <defs>
    <radialGradient id="sky" cx="50%" cy="18%" r="95%">
      <stop offset="0%" stop-color="#151d42"/>
      <stop offset="55%" stop-color="#0d1430"/>
      <stop offset="100%" stop-color="#05070f"/>
    </radialGradient>
    <radialGradient id="magicGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8cc8ff" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#78b9ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#78b9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c8f0ff" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#78c8ff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#78c8ff" stop-opacity="0"/>
