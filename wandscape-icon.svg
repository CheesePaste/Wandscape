<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sky" cx="50%" cy="18%" r="95%">
      <stop offset="0%" stop-color="#151d42"/>
      <stop offset="55%" stop-color="#0d1430"/>
      <stop offset="100%" stop-color="#05070f"/>
    </radialGradient>
    <radialGradient id="magicGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8cc8ff" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#78b9ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#78b9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c8f0ff" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#78c8ff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#78c8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbCore" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#d8f3ff"/>
      <stop offset="70%" stop-color="#7fd0ff"/>
      <stop offset="100%" stop-color="#2e7bff"/>
    </radialGradient>
    <linearGradient id="wandWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e1d10"/>
      <stop offset="40%" stop-color="#5a3a20"/>
      <stop offset="60%" stop-color="#6b4326"/>
      <stop offset="100%" stop-color="#241505"/>
    </linearGradient>
    <path id="spark" d="M0,-11 L2.3,-2.3 L11,0 L2.3,2.3 L0,11 L-2.3,2.3 L-11,0 L-2.3,-2.3 Z"/>
  </defs>

  <!-- 夜空背景 -->
  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- 星光 -->
  <circle cx="70"  cy="120" r="2"   fill="#fff" opacity="0.7"/>
  <circle cx="118" cy="58"  r="1.6" fill="#fff" opacity="0.6"/>
  <circle cx="172" cy="92"  r="2.4" fill="#fff" opacity="0.85"/>
  <circle cx="222" cy="46"  r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="300" cy="52"  r="2"   fill="#fff" opacity="0.75"/>
  <circle cx="352" cy="84"  r="1.6" fill="#fff" opacity="0.55"/>
  <circle cx="402" cy="56"  r="2.2" fill="#fff" opacity="0.8"/>
  <circle cx="444" cy="112" r="1.6" fill="#fff" opacity="0.6"/>
  <circle cx="58"  cy="214" r="1.8" fill="#fff" opacity="0.5"/>
  <circle cx="468" cy="204" r="2"   fill="#fff" opacity="0.65"/>
  <circle cx="330" cy="150" r="1.4" fill="#fff" opacity="0.45"/>
  <circle cx="150" cy="158" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="404" cy="152" r="1.8" fill="#fff" opacity="0.6"/>
  <circle cx="92"  cy="320" r="1.5" fill="#fff" opacity="0.45"/>
  <circle cx="440" cy="300" r="1.6" fill="#fff" opacity="0.5"/>
  <circle cx="250" cy="40"  r="2.4" fill="#fff" opacity="0.7"/>

  <!-- 魔法环境光 -->
  <circle cx="256" cy="238" r="240" fill="url(#magicGlow)"/>

  <!-- 魔法阵 -->
  <circle cx="256" cy="238" r="180" fill="none" stroke="#a8e0ff" stroke-width="5" opacity="0.85"/>
  <circle cx="256" cy="238" r="200" fill="none" stroke="#a8e0ff" stroke-width="3" stroke-dasharray="5 21" opacity="0.45"/>
  <circle cx="256" cy="238" r="156" fill="none" stroke="#a8e0ff" stroke-width="2" opacity="0.4"/>
  <polygon points="256,112 365,301 147,301" fill="#a8e0ff" fill-opacity="0.07" stroke="#a8e0ff" stroke-width="5" stroke-linejoin="round" opacity="0.9"/>
  <polygon points="256,364 365,175 147,175" fill="#a8e0ff" fill-opacity="0.07" stroke="#a8e0ff" stroke-width="5" stroke-linejoin="round" opacity="0.9"/>
  <!-- 六芒星顶点光点 -->
  <circle cx="256" cy="112" r="4" fill="#cfeaff" opacity="0.95"/>
  <circle cx="365" cy="301" r="4" fill="#cfeaff" opacity="0.95"/>
  <circle cx="147" cy="301" r="4" fill="#cfeaff" opacity="0.95"/>
  <circle cx="256" cy="364" r="4" fill="#cfeaff" opacity="0.95"/>
  <circle cx="365" cy="175" r="4" fill="#cfeaff" opacity="0.95"/>
  <circle cx="147" cy="175" r="4" fill="#cfeaff" opacity="0.95"/>
  <!-- 符文刻度点 -->
  <circle cx="256" cy="38"  r="4" fill="#a8e0ff" opacity="0.8"/>
  <circle cx="256" cy="438" r="4" fill="#a8e0ff" opacity="0.8"/>
  <circle cx="56"  cy="238" r="4" fill="#a8e0ff" opacity="0.8"/>
  <circle cx="456" cy="238" r="4" fill="#a8e0ff" opacity="0.8"/>
  <circle cx="115" cy="97"  r="4" fill="#a8e0ff" opacity="0.8"/>
  <circle cx="397" cy="97"  r="4" fill="#a8e0ff" opacity="0.8"/>
  <circle cx="115" cy="379" r="4" fill="#a8e0ff" opacity="0.8"/>
  <circle cx="397" cy="379" r="4" fill="#a8e0ff" opacity="0.8"/>

  <!-- 法杖 -->
  <polygon points="247,470 265,470 260,196 252,196" fill="url(#wandWood)"/>
  <rect x="253"   y="130" width="6" height="67" fill="#2e1d10"/>

  <!-- 杖顶光球 -->
  <circle cx="256" cy="116" r="70" fill="url(#orbGlow)"/>
  <circle cx="256" cy="116" r="17" fill="url(#orbCore)"/>
  <circle cx="250" cy="110" r="5"  fill="#fff" opacity="0.9"/>

  <!-- 小镇剪影 -->
  <path d="M 58,512 L 82,396 L 106,512 L 130,404 L 158,512 L 188,394 L 216,512
           L 240,512 L 240,398 Q 258,374 276,398 L 276,512 L 300,512
           L 326,396 L 352,512 L 378,404 L 404,512 L 430,394 L 454,512 Z"
        fill="#070b1a"/>
  <rect x="138" y="372" width="8" height="70" fill="#070b1a"/>
  <rect x="198" y="368" width="7" height="80" fill="#070b1a"/>

  <!-- 前景星光 -->
  <use href="#spark" transform="translate(120,140) scale(0.8)" fill="#cfeaff" opacity="0.9"/>
  <use href="#spark" transform="translate(392,130) scale(1)"   fill="#ffffff" opacity="0.85"/>
  <use href="#spark" transform="translate(70,300)  scale(0.6)" fill="#cfeaff" opacity="0.7"/>
  <use href="#spark" transform="translate(430,250) scale(0.7)" fill="#ffffff" opacity="0.7"/>
  <use href="#spark" transform="translate(256,58)  scale(0.7)" fill="#cfeaff" opacity="0.8"/>
</svg>
