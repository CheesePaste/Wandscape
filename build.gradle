plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    // Parchment 映射通道由该插件注册；只加仓库不够，必须真的应用插件，否则 mapping_channel=parchment 会报 Unknown mapping provider。
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.20.1, so mods should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    distributionType = Wrapper.DistributionType.BIN
}

minecraft {
    // parchment 通道由 org.parchmentmc.librarian.forgegradle 插件注册（见 settings.gradle），
    // 版本串形如 <parchment 日期>-<MC 版本>。
    mappings channel: mapping_channel, version: mapping_version

    // Access Transformer：FG6 只在开发期生效，打包时 FG6 会把该文件塞进 jar 的 META-INF/。
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {}

        server {
            args '--nogui'
        }
    }
}

// refmap 生成：Forge 1.20.1 生产环境跑 SRG 名，mixin 必须有 refmap，否则线上注入全部失效。
// Refmap generation: Forge runs SRG names in production, so mixins need a refmap or injection silently fails.
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
}

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir 'src/generated/resources'

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    mavenCentral()
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        name = "Iron's Maven - Release"
        url = "https://code.redspace.io/releases"
    }
    maven {
        name = "Illusive Soulworks maven"
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    // Forge 1.20.1 本体。FG6 要求用 minecraft 配置声明，而不是普通依赖。
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // refmap 生成器：mixin 注解处理器。
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Forge 1.20.1 的模组依赖必须用 fg.deobf(...) 包裹（发布件是 SRG 名）。

    // JEI — 可选运行时依赖，compileOnly 不打包；玩家自行装 JEI。无 JEI 时其余功能不受影响。
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")

    // Iron's Spells 'n Spellbooks — 可选兼容依赖，compileOnly 不打包
    compileOnly fg.deobf("io.redspace:irons_spellbooks:${irons_spells_version}")

    // Curios API — 可选兼容依赖，compileOnly 不打包；玩家自行装 Curios。未装时法师饰品功能自动隐藏。
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")

    // 诡厄巫法 (Goety) — 可选兼容依赖，compileOnly 不打包；玩家自行装 Goety。未装时相关功能自动隐藏。
    compileOnly fg.deobf("curse.maven:goety-586095:${goety_version}")

    // 帕秋莉手册 (Patchouli) — 可选软依赖，compileOnly 不打包；提供文档指南 API
    compileOnly fg.deobf("vazkii.patchouli:Patchouli:${patchouli_version}:api")
}

// mods.toml 的占位符展开。Forge 侧元数据直接住在 resources 里，不再走模板目录 + 自定义 task。
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                // Forge 1.20.1 用 JAR manifest 声明 mixin 配置（NeoForge 的 mods.toml [[mixins]] 块不适用）。
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // Forge 1.20.1 产物必须重混淆回 SRG 名。
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
