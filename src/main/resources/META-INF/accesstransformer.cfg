# Wandscape Access Transformers
# NeoForge 官方提权机制：在编译期与运行期一起放宽原版成员的访问级别。整行注释以 '#' 开头。
#
# HostileTargetingHandler 需要读取原版索敌目标类：NearestAttackableTargetGoal#targetType
# 是 protected final 字段（编译期与运行期均不可跨包访问）。经 AT 提为 public 后，
# content/npc/HostileTargetingHandler 可直接读该字段。（详见 docs/adr.md）
public net.minecraft.world.entity.ai.goal.target.NearestAttackableTargetGoal targetType

# ExplorationLootEstimator 需要按权重遍历战利品表结构来算元素价值期望（而不是抽样）。
# LootTable#pools 与 LootPool#entries 都是 private final 且原版没给 getter；
# 拿到它们之后，展开（LootPoolEntryContainer#expand）与权重（LootPoolEntry#getWeight）
# 都是公开 API，不需要再动别的字段。两个都是只读用途。
public net.minecraft.world.level.storage.loot.LootTable pools
public net.minecraft.world.level.storage.loot.LootPool entries