<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wandscape 魔法阵编辑器</title>
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <span class="brand">Wandscape 魔法阵编辑器</span>
        <div class="group">
          <button id="btn-new">新建</button>
          <button id="btn-import">导入 JSON</button>
          <button id="btn-export">导出 JSON</button>
          <button id="btn-copy">复制 JSON</button>
        </div>
        <div class="group" id="view-group">
          <span class="label">视图</span>
          <button data-view="top" class="active">俯视</button>
          <button data-view="frontX">前-X</button>
          <button data-view="frontZ">前-Z</button>
        </div>
        <div class="group" id="mode-group">
          <span class="label">预览</span>
          <button data-mode="particle" class="active">粒子</button>
          <button data-mode="geometry">几何</button>
        </div>
        <div class="spacer"></div>
        <input type="file" id="file-input" accept="application/json,.json" hidden />
        <button id="btn-fit">适配视图</button>
      </header>

      <datalist id="particle-list"></datalist>

      <div id="body">
        <main id="canvas-wrap">
          <canvas id="canvas"></canvas>
          <div id="toast" class="hidden"></div>
        </main>
        <aside id="panel">
          <div class="panel-section">
            <h3>法阵</h3>
            <div class="f-row">
              <label class="f-label">id</label>
              <input id="f-id" type="text" spellcheck="false" />
            </div>
            <div class="f-row">
              <label class="f-label">时长 duration_ticks</label>
              <input id="f-duration" type="number" min="1" step="1" />
            </div>
            <div class="f-row">
              <label class="f-label">离地高度 height</label>
              <input id="f-height" type="number" min="0" step="0.05" />
            </div>
          </div>
          <div class="panel-section">
            <h3>元素 <span id="elem-count" class="muted"></span></h3>
            <div id="elem-list"></div>
            <div class="axis-row">
              <button id="btn-add-ring" class="mini">+环</button>
              <button id="btn-add-arc" class="mini">+弧</button>
              <button id="btn-add-glyph" class="mini">+符文</button>
              <button id="btn-del-elem" class="mini danger">删</button>
            </div>
            <div class="axis-row">
              <button id="btn-cascade" class="mini wide">自动级联 start</button>
            </div>
          </div>
          <div class="panel-section" id="elem-props"></div>
        </aside>
      </div>

      <div id="timeline">
        <div class="tl-row">
          <button id="btn-play" title="播放/暂停（空格）">▶</button>
          <button id="btn-reset" title="回到 t=0">⏮</button>
          <span id="time-readout" class="readout"></span>
          <span class="tl-sep"></span>
          <label class="tl-label"><input id="chk-static" type="checkbox" /> 静态</label>
          <label class="tl-label"><input id="chk-loop" type="checkbox" checked /> 循环</label>
          <select id="sel-speed" title="播放倍速">
            <option value="1">1x</option>
            <option value="2">2x</option>
            <option value="4">4x</option>
          </select>
        </div>
        <canvas id="timeline-canvas" height="18"></canvas>
        <input id="scrub" type="range" min="0" max="1000" value="0" />
      </div>

      <footer id="status">
        <span id="status-spec"></span>
        <span id="status-zoom"></span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
